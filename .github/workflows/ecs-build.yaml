name: Reusable Build and Deploy to ECS

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Service name (must match a folder in deploy-configs/)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev, sit, uat, prod)'
        required: true
        type: string
      java_version:
        description: 'Java version to build with (e.g. 17, 21)'
        required: true
        type: string
      docker_image:
        description: 'Base Docker image for the Dockerfile (e.g. eclipse-temurin:17-jre-alpine)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy (${{ inputs.service_name }} - ${{ inputs.environment }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          path: app-code

      - name: Checkout deploy configs
        uses: actions/checkout@v4
        with:
          ref: deploy-config
          path: deploy-configs
          sparse-checkout: 'deploy-configs/${{ inputs.service_name }}'

      - name: Check repo structure for debugging
        run: |
          echo "=== app-code ==="
          tree app-code
          echo "=== deploy-configs ==="
          tree deploy-configs

      - name: Load properties file
        id: config
        run: |
          PROPS_FILE="deploy-configs/deploy-configs/${{ inputs.service_name }}/${{ inputs.environment }}.properties"
          if [ ! -f "$PROPS_FILE" ]; then
            echo "::error::Properties file not found: $PROPS_FILE"
            exit 1
          fi
          echo "--- Loading config from $PROPS_FILE ---"
          cat "$PROPS_FILE"
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done < "$PROPS_FILE"

      - name: Set up Java ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Copy Dockerfile from deploy configs
        run: |
          DOCKERFILE_PATH="deploy-configs/deploy-configs/${{ inputs.service_name }}/Dockerfile"
          if [ ! -f "$DOCKERFILE_PATH" ]; then
            echo "::error::Dockerfile not found at $DOCKERFILE_PATH"
            exit 1
          fi
          cp "$DOCKERFILE_PATH" app-code/spring-boot-examples/spring-boot-web-application/Dockerfile
          echo "--- Using Dockerfile for ${{ inputs.service_name }} ---"
          cat app-code/spring-boot-examples/spring-boot-web-application/Dockerfile

      - name: Configure AWS credentials for Secrets Manager
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::289491622160:role/rest-service-dev-github-actions-ecs-deploy
          aws-region: us-east-1

      - name: Retrieve artifact credentials from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            NEXUS, artifact_credentials
          parse-json-secrets: true

      - name: Generate Maven settings.xml
        env:
          NEXUS_USERNAME: ${{ env.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ env.NEXUS_PASSWORD }}
          NEXUS_URL: ${{ secrets.nexus_url }}
        run: |
          SETTINGS_DIR="app-code/spring-boot-examples/spring-boot-web-application"
          cat > "${SETTINGS_DIR}/settings.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>nexus</id>
                <username>NEXUS_USERNAME_PLACEHOLDER</username>
                <password>NEXUS_PASSWORD_PLACEHOLDER</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>nexus</id>
                <repositories>
                  <repository>
                    <id>nexus</id>
                    <url>NEXUS_URL_PLACEHOLDER</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>nexus</activeProfile>
            </activeProfiles>
          </settings>
          XMLEOF

          sed -i "s|NEXUS_USERNAME_PLACEHOLDER|${NEXUS_USERNAME}|g" "${SETTINGS_DIR}/settings.xml"
          sed -i "s|NEXUS_PASSWORD_PLACEHOLDER|${NEXUS_PASSWORD}|g" "${SETTINGS_DIR}/settings.xml"
          sed -i "s|NEXUS_URL_PLACEHOLDER|${NEXUS_URL}|g" "${SETTINGS_DIR}/settings.xml"

          echo "--- Generated settings.xml ---"
          cat "${SETTINGS_DIR}/settings.xml"

      - name: Build with Maven
        id: maven-build
        run: |
          cd app-code/spring-boot-examples/spring-boot-web-application
          mvn clean package -s settings.xml -DskipTests
          JAR_FILE=$(ls target/*.jar | head -1 | xargs basename | sed 's/\.jar$//')
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "--- Built JAR: $JAR_FILE ---"

      - name: Update Dockerfile with dynamic values
        run: |
          DOCKERFILE="app-code/spring-boot-examples/spring-boot-web-application/Dockerfile"
          sed -i "s|DOCKER_IMAGE|${{ inputs.docker_image }}|g" "$DOCKERFILE"
          sed -i "s|JAR_FILE|${{ steps.maven-build.outputs.jar_file }}|g" "$DOCKERFILE"
          echo "--- Final Dockerfile ---"
          cat "$DOCKERFILE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.iam_role }}
          aws-region: ${{ steps.config.outputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REPOSITORY_URI: ${{ steps.config.outputs.ecr_uri }}
          IMAGE_TAG: latest.gh-${{ github.run_number }}
        run: |
          echo "Tagging image as: $IMAGE_TAG"
          
          echo "::group::Docker Build Grouped Logs"
          docker build -t $ECR_REPOSITORY_URI:$IMAGE_TAG \
            -f app-code/spring-boot-examples/spring-boot-web-application/Dockerfile \
            app-code/spring-boot-examples/spring-boot-web-application
          echo "::endgroup::"
          
          docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Pull task definition from ECS
        id: pull-task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ steps.config.outputs.ecs_task_definition }} \
            --query 'taskDefinition' \
            --output json | jq \
              --arg cpu "${{ steps.config.outputs.cpu }}" \
              --arg mem "${{ steps.config.outputs.memory }}" \
              'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) | .cpu = $cpu | .memory = $mem' > task-definition.json
          echo "Pulled and cleaned task definition (cpu=${{ steps.config.outputs.cpu }}, memory=${{ steps.config.outputs.memory }}):"
          cat task-definition.json

      - name: Update image in task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ steps.config.outputs.container_name }}
          image: ${{ steps.config.outputs.ecr_uri }}:${{ steps.build-image.outputs.image_tag }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ steps.config.outputs.ecs_service }}
          cluster: ${{ steps.config.outputs.ecs_cluster }}
          wait-for-service-stability: true

      - name: Set desired count to 2
        run: |
          aws ecs update-service \
            --cluster ${{ steps.config.outputs.ecs_cluster }} \
            --service ${{ steps.config.outputs.ecs_service }} \
            --desired-count 2

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz | tar xzf -
          sudo mv k6-v0.50.0-linux-amd64/k6 /usr/local/bin/

      - name: Run k6 smoke tests
        env:
          BASE_URL: http://rest-service-dev-alb-456898945.us-east-1.elb.amazonaws.com
        run: |
          k6 run app-code/spring-boot-examples/spring-boot-web-application/k6/smoke-test.js