name: Reusable Build and Deploy Frontend to ECS

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Service name (must match a folder in deploy-configs/)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev, sit, uat, prod)'
        required: true
        type: string
      node_version:
        description: 'Node.js version to build with (e.g. 18, 20, 22)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy (${{ inputs.service_name }} - ${{ inputs.environment }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          path: app-code

      - name: Checkout deploy configs
        uses: actions/checkout@v4
        with:
          ref: deploy-config
          path: deploy-configs
          sparse-checkout: 'deploy-configs/${{ inputs.service_name }}'

      - name: Check repo structure for debugging
        run: |
          echo "=== app-code ==="
          tree app-code
          echo "=== deploy-configs ==="
          tree deploy-configs

      - name: Load properties file
        id: config
        run: |
          PROPS_FILE="deploy-configs/deploy-configs/${{ inputs.service_name }}/${{ inputs.environment }}.properties"
          if [ ! -f "$PROPS_FILE" ]; then
            echo "::error::Properties file not found: $PROPS_FILE"
            exit 1
          fi
          echo "--- Loading config from $PROPS_FILE ---"
          cat "$PROPS_FILE"
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done < "$PROPS_FILE"

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: app-code/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd app-code/frontend
          npm ci

      - name: Build Next.js application
        env:
          API_URL: ${{ steps.config.outputs.api_url }}
        run: |
          cd app-code/frontend
          npm run build

      - name: Copy Dockerfile from deploy configs
        run: |
          DOCKERFILE_PATH="deploy-configs/deploy-configs/${{ inputs.service_name }}/Dockerfile"
          if [ -f "$DOCKERFILE_PATH" ]; then
            cp "$DOCKERFILE_PATH" app-code/frontend/Dockerfile
            echo "--- Using Dockerfile from deploy-configs ---"
          else
            echo "--- Using default Dockerfile from frontend/ ---"
          fi
          cat app-code/frontend/Dockerfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.iam_role }}
          aws-region: ${{ steps.config.outputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REPOSITORY_URI: ${{ steps.config.outputs.ecr_uri }}
          IMAGE_TAG: latest.gh-${{ github.run_number }}
          API_URL: ${{ steps.config.outputs.api_url }}
        run: |
          echo "Tagging image as: $IMAGE_TAG"
          
          echo "::group::Docker Build Grouped Logs"
          docker build \
            --build-arg API_URL=$API_URL \
            -t $ECR_REPOSITORY_URI:$IMAGE_TAG \
            app-code/frontend
          echo "::endgroup::"
          
          docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Pull task definition from ECS
        id: pull-task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ steps.config.outputs.ecs_task_definition }} \
            --query 'taskDefinition' \
            --output json | jq \
              --arg cpu "${{ steps.config.outputs.cpu }}" \
              --arg mem "${{ steps.config.outputs.memory }}" \
              'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) | .cpu = $cpu | .memory = $mem' > task-definition.json
          echo "Pulled and cleaned task definition (cpu=${{ steps.config.outputs.cpu }}, memory=${{ steps.config.outputs.memory }}):"
          cat task-definition.json

      - name: Update image in task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ steps.config.outputs.container_name }}
          image: ${{ steps.config.outputs.ecr_uri }}:${{ steps.build-image.outputs.image_tag }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ steps.config.outputs.ecs_service }}
          cluster: ${{ steps.config.outputs.ecs_cluster }}
          wait-for-service-stability: true

      - name: Set desired count to 2
        run: |
          aws ecs update-service \
            --cluster ${{ steps.config.outputs.ecs_cluster }} \
            --service ${{ steps.config.outputs.ecs_service }} \
            --desired-count 2
