name: Deploy ECS Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Service to deploy (must match a folder in deploy-configs/)'
        required: true
        type: choice
        options:
          - rest-service
          - frontend-app
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - sit
          - uat
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.service_name }} to ${{ inputs.environment }}
    uses: ./.github/workflows/ecs-build.yaml
    with:
      service_name: ${{ inputs.service_name }}
      environment: ${{ inputs.environment }}